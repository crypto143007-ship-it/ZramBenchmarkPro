name: Build and Release APK

on:
  push:
    branches: [main]
    paths:
      - 'ZramBenchmarkPro-source.zip'
      - '.github/workflows/release-apk.yml'
      - 'app/src/main/java/com/zrambenchmark/pro/BenchmarkEngine.kt'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zrambenchmarkpro-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Android project
        shell: bash
        run: |
          test -f ZramBenchmarkPro-source.zip
          unzip -t ZramBenchmarkPro-source.zip
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q ZramBenchmarkPro-source.zip -d "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/ZramBenchmarkPro/settings.gradle.kts"
          test -f "$RUNNER_TEMP/project/ZramBenchmarkPro/app/build.gradle.kts"
          # Overlay the corrected Kotlin source committed in the repository.
          install -D app/src/main/java/com/zrambenchmark/pro/BenchmarkEngine.kt "$RUNNER_TEMP/project/ZramBenchmarkPro/app/src/main/java/com/zrambenchmark/pro/BenchmarkEngine.kt"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("$RUNNER_TEMP/project/ZramBenchmarkPro")
          ui = root / "app/src/main/java/com/zrambenchmark/pro/MainActivity.kt"
          s = ui.read_text()
          replacements = {
              "BenchmarkEngine.runStandalone(rounds, size) { !running }": "BenchmarkEngine.runKernel(rounds, size)",
              "Warming up and measuring standalone DEFLATE…": "Preparing isolated kernel ZRAM test device…",
              "Completed · round-trip verified": "Completed · kernel read-back verified",
              "Standalone benchmark": "Native kernel ZRAM benchmark",
              "The initial engine tests JDK DEFLATE with identical deterministic mixed-content data, warm-up, repeated compression/decompression, and byte-for-byte round-trip verification. It is not a kernel ZRAM benchmark.": "The app uses the codec selected on active swap, creates a temporary ZRAM device with that codec, writes and reads a mixed dataset through the kernel, verifies every byte and reads mm_stat. Active swap is never used as the test target.",
              "Run a standalone test to create the first verified result. Kernel algorithms are discovered separately and are not silently switched.": "Run a native kernel ZRAM test. Root and hot_add/hot_remove support are required; active swap is never used as the test target.",
              "Standalone tests are clearly separated from real ZRAM measurements.": "The benchmark uses the active swap codec on a temporary ZRAM device; live swap is left untouched.",
              "Start benchmark": "Start native ZRAM test",
              "Safety: standalone compression only. No swapoff, no zram reset, no algorithm write, no memory-exhaustion test.": "Safety: requires root. Uses only a temporary hot-added ZRAM device, then removes it. Never changes the live swap device. The test stops if safe temporary-device support is unavailable.",
              "Verified benchmark result": "Verified kernel ZRAM result",
              "Thread CPU time (avg per operation)": "Median kernel write / read time",
              "CPU time is process thread CPU time from Android Debug; it is not whole-device CPU utilization or hardware cycles.": "Write throughput measures the kernel ZRAM compression path; read throughput measures the decompression path. These include block I/O and memory-copy overhead; CPU cycles are not measured.",
              "Median compression / decompression": "Median kernel write / read"
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          ui.write_text(s)
          gradle = root / "app/build.gradle.kts"
          g = gradle.read_text().replace("versionCode = 1", "versionCode = 2").replace('versionName = "0.1.0"', 'versionName = "0.2.0"')
          gradle.write_text(g)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: ${{ runner.temp }}/project/ZramBenchmarkPro
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          APK="$RUNNER_TEMP/project/ZramBenchmarkPro/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/ZramBenchmarkPro-v0.2.0-debug.apk"
          echo "path=$RUNNER_TEMP/ZramBenchmarkPro-v0.1.0-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZramBenchmarkPro-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          TAG="v0.2.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZRAM Benchmark Pro 0.2.0" \
              --notes "Installable debug-signed APK for ZRAM Benchmark Pro 0.2.0. Benchmarks the codec selected on active swap using a separate temporary ZRAM device; it never writes to active swap. Requires root and kernel zram-control hot_add/hot_remove support."
          fi
