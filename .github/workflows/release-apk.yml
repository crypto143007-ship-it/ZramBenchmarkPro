name: Build and Release APK

on:
  push:
    branches: [main]
    paths:
      - 'ZramBenchmarkPro-source.zip'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zrambenchmarkpro-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Android project
        shell: bash
        run: |
          test -f ZramBenchmarkPro-source.zip
          unzip -t ZramBenchmarkPro-source.zip
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q ZramBenchmarkPro-source.zip -d "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/ZramBenchmarkPro/settings.gradle.kts"
          test -f "$RUNNER_TEMP/project/ZramBenchmarkPro/app/build.gradle.kts"
          # Overlay the corrected Kotlin source committed in the repository.
          install -D app/src/main/java/com/zrambenchmark/pro/BenchmarkEngine.kt "$RUNNER_TEMP/project/ZramBenchmarkPro/app/src/main/java/com/zrambenchmark/pro/BenchmarkEngine.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: ${{ runner.temp }}/project/ZramBenchmarkPro
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          APK="$RUNNER_TEMP/project/ZramBenchmarkPro/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/ZramBenchmarkPro-v0.1.0-debug.apk"
          echo "path=$RUNNER_TEMP/ZramBenchmarkPro-v0.1.0-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZramBenchmarkPro-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          TAG="v0.1.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZRAM Benchmark Pro 0.1.0" \
              --notes "Installable debug-signed APK for ZRAM Benchmark Pro 0.1.0. This milestone measures standalone Java DEFLATE; it does not benchmark or modify active kernel ZRAM codecs."
          fi
